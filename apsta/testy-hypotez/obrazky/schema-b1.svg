  <text class="ink" x="129.0" y="135.0" text-anchor="middle" font-weight="700" font-size="19">μ, σ známé</text>
  <text class="ink2" x="129.0" y="157.0" text-anchor="middle" font-size="17">u-test, N(0,1)</text>
  <rect class="boxok" stroke-width="1.5" x="24" y="180" width="210" height="60"/>
