  <text class="ink2" x="303.0" y="261.0" text-anchor="middle" font-size="17">limitní</text>
  <text class="ink2" x="303.0" y="283.0" text-anchor="middle" font-size="17">u-test</text>
  <rect class="box" stroke-width="1.5" x="366" y="200" width="110" height="110"/>
