  <text class="ink2" x="129.0" y="227.0" text-anchor="middle" font-size="17">t-test, t(n − 1)</text>
  <rect class="boxok" stroke-width="1.5" x="24" y="250" width="210" height="60"/>
  <text class="ink" x="129.0" y="275.0" text-anchor="middle" font-weight="700" font-size="19">σ²</text>
  <text class="ink2" x="129.0" y="297.0" text-anchor="middle" font-size="17">χ² test, χ²(n − 1)</text>
