<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19">
  <style>
    .ink { fill: #1a1f27; } .ink2 { fill: #4b5563; } .line { stroke: #1a1f27; } .faint { stroke: #d3d9e2; }
    .keep { fill: #e3f1e6; } .reject { fill: #fbe7e5; stroke: #b3261e; } .rej { fill: #b3261e; } .ok { fill: #1f6b47; }
    .beta { fill: #e6eefb; stroke: #1f56b8; } .acc { fill: #1f56b8; } .accl { stroke: #1f56b8; }
    .okl { stroke: #1f6b47; } .rejl { stroke: #b3261e; } .ink2l { stroke: #4b5563; }
    .box { fill: #ffffff; stroke: #4b5563; } .boxa { fill: #e6eefb; stroke: #1f56b8; } .boxok { fill: #e3f1e6; stroke: #1f6b47; } .boxbad { fill: #fbe7e5; stroke: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e9ecf1; } .ink2 { fill: #aab2bf; } .line { stroke: #e9ecf1; } .faint { stroke: #333b47; }
      .keep { fill: #1c3328; } .reject { fill: #3d2220; stroke: #ff9a92; } .rej { fill: #ff9a92; } .ok { fill: #7fd4a5; }
      .beta { fill: #232d3f; stroke: #8db4ff; } .acc { fill: #8db4ff; } .accl { stroke: #8db4ff; }
      .okl { stroke: #7fd4a5; } .rejl { stroke: #ff9a92; } .ink2l { stroke: #aab2bf; }
      .box { fill: #1a1f26; stroke: #aab2bf; } .boxa { fill: #232d3f; stroke: #8db4ff; } .boxok { fill: #1c3328; stroke: #7fd4a5; } .boxbad { fill: #3d2220; stroke: #ff9a92; }
    }
  </style>
  <text class="ink" x="16.0" y="30.0" text-anchor="start" font-weight="700">SST = 10</text>
  <rect class="boxok" stroke-width="1.5" x="16" y="44" width="286.7" height="56"/>
  <rect class="boxbad" stroke-width="1.5" x="302.7" y="44" width="161.3" height="56"/>
  <text class="ok" x="159.4" y="79.0" text-anchor="middle" font-weight="700">SSreg = 6,4</text>
  <text class="rej" x="383.4" y="79.0" text-anchor="middle" font-weight="700">SSres = 3,6</text>
  <text class="ok" x="159.4" y="128.0" text-anchor="middle" font-size="17">vysvětleno modelem</text>
  <text class="rej" x="383.4" y="128.0" text-anchor="middle" font-size="17">nevysvětleno</text>
  <text class="ink" x="16.0" y="166.0" text-anchor="start" font-weight="700">R² = SSreg / SST = 6,4 / 10 = 0,64</text>
</svg>
